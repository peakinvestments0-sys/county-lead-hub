<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Florida Lead Hub Helper</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #091122;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .badge-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .title {
      font-weight: 800;
      font-size: 13px;
      color: #ffffff;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 10px;
      color: #94a3b8;
    }
    .status-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .dot-green { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
    .dot-red { background: #ef4444; }
    .lead-box {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #334155;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge-icon">⚡</div>
    <div>
      <div class="title">Florida Lead Hub</div>
      <div class="subtitle">Skip Trace Auto-Sync Extension</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color: #94a3b8;">Hub Server:</span>
      <span id="serverStatus" style="font-weight: bold; color: #10b981;">
        <span class="dot dot-green"></span> Checking...
      </span>
    </div>
    <div class="lead-box" id="leadInfo">
      <div style="color: #64748b; font-size: 10px;">CURRENT LEAD BEING RESEARCHED</div>
      <div style="font-weight: bold; color: #38bdf8; margin-top: 2px;" id="leadName">No active lead selected</div>
      <div style="font-size: 10px; color: #94a3b8;" id="leadDetails">Click "📞 Free Trace" in Lead Hub</div>
    </div>
  </div>

  <a href="http://localhost:8505" target="_blank" class="btn">
    <span>🌐</span> <span>Open Florida Lead Hub</span>
  </a>

  <script src="popup.js"></script>
</body>
</html>
